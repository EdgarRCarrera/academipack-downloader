name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2a2dd30f8030072d379eb0c9ea51789aa2ea9ca4
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@2a2dd30f8030072d379eb0c9ea51789aa2ea9ca4

      - name: Analyze
        uses: github/codeql-action/analyze@2a2dd30f8030072d379eb0c9ea51789aa2ea9ca4
